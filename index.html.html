<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#00a884" />
  <title>My Chat</title>
  <style>
    :root {
      --primary: #00a884;
      --primary-dark: #008069;
      --bg-app: #dadbd3;
      --bg-panel: #f0f2f5;
      --bg-chat: #efeae2;
      --bubble-out: #d9fdd3;
      --bubble-in: #ffffff;
      --text-main: #111b21;
      --text-muted: #667781;
      --border: #e9edef;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-app); color: var(--text-main); height: 100vh; overflow: hidden; }

    /* Top WhatsApp Green Strip */
    .top-strip { position: fixed; top: 0; left: 0; right: 0; height: 127px; background: var(--primary); z-index: 0; }

    /* Auth Screen */
    #auth-screen {
      position: relative; z-index: 2; height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px;
    }
    .auth-card {
      background: #fff; width: 100%; max-width: 420px; border-radius: 12px; padding: 28px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.16);
    }
    .auth-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .auth-logo {
      width: 44px; height: 44px; border-radius: 50%; background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px;
    }
    .auth-brand h1 { font-size: 22px; color: var(--text-main); }
    .auth-tagline { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }

    .auth-tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 18px; }
    .auth-tab {
      flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: 600; color: var(--text-muted);
      border-bottom: 3px solid transparent; margin-bottom: -2px;
    }
    .auth-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--text-main); }
    .field input {
      width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none;
    }
    .field input:focus { border-color: var(--primary); }
    .btn-primary {
      width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px;
    }
    .btn-primary:hover { filter: brightness(0.95); }
    .auth-error { color: #dc2626; font-size: 13px; margin-top: 10px; min-height: 18px; text-align: center; }

    /* Main App Container */
    #app-screen {
      display: none; position: relative; z-index: 2; width: 100%; max-width: 1440px; height: 100vh;
      margin: 0 auto; padding: 18px;
    }
    .app-shell {
      display: flex; width: 100%; height: 100%; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,0.14);
      border-radius: 4px; overflow: hidden;
    }

    /* Sidebar (Chat List) */
    .sidebar { width: 360px; min-width: 300px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: #fff; }
    .sidebar-header {
      height: 60px; background: var(--bg-panel); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between;
    }
    .my-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%; color: #fff; font-weight: 700; display: flex;
      align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; position: relative;
    }
    .online-dot {
      width: 11px; height: 11px; background: #22c55e; border: 2px solid #fff; border-radius: 50%;
      position: absolute; bottom: 0; right: 0;
    }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .icon-btn {
      background: transparent; border: none; color: #54656f; cursor: pointer; padding: 6px 8px; border-radius: 6px;
      font-size: 13px; font-weight: 600; text-decoration: none;
    }
    .icon-btn:hover { background: rgba(0,0,0,0.06); }

    .search-box { padding: 8px 12px; border-bottom: 1px solid var(--border); background: #fff; }
    .search-box input {
      width: 100%; padding: 8px 14px; border-radius: 8px; border: none; background: var(--bg-panel); font-size: 14px; outline: none;
    }

    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f5f6f6;
    }
    .chat-item:hover { background: #f5f6f6; }
    .chat-item.active { background: #f0f2f5; }
    .chat-meta { flex: 1; min-width: 0; }
    .chat-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
    .chat-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-time { font-size: 11px; color: var(--text-muted); }
    .chat-bottom { display: flex; justify-content: space-between; align-items: center; }
    .chat-preview { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .unread-badge {
      background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; min-width: 20px; height: 20px;
      border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 0 6px;
    }

    /* Main Chat Area */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); position: relative; }
    .chat-header {
      height: 60px; background: var(--bg-panel); padding: 10px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .back-btn { display: none; background: none; border: none; font-size: 20px; cursor: pointer; color: #54656f; }
    .chat-header-info { flex: 1; }
    .chat-header-info h3 { font-size: 16px; }
    .chat-header-info p { font-size: 12px; color: var(--text-muted); }

    .announcement-bar {
      background: #fef9c3; color: #854d0e; padding: 7px 14px; font-size: 13px; border-bottom: 1px solid #fde047;
      display: none; align-items: center; gap: 8px;
    }

    .messages-container {
      flex: 1; overflow-y: auto; padding: 18px 5%; display: flex; flex-direction: column; gap: 6px;
      background-image: radial-gradient(rgba(0,0,0,0.04) 1px, transparent 1px); background-size: 18px 18px;
    }
    .msg-row { display: flex; flex-direction: column; max-width: 72%; }
    .msg-row.out { align-self: flex-end; }
    .msg-row.in { align-self: flex-start; }
    .msg-row.admin { align-self: center; max-width: 85%; }

    .bubble {
      padding: 7px 11px 6px; border-radius: 8px; box-shadow: 0 1px 1px rgba(0,0,0,0.12);
      position: relative; word-wrap: break-word; font-size: 14.5px; line-height: 1.4;
    }
    .msg-row.out .bubble { background: var(--bubble-out); border-top-right-radius: 0; }
    .msg-row.in .bubble { background: var(--bubble-in); border-top-left-radius: 0; }
    .msg-row.admin .bubble { background: #dbeafe; color: #1e3a8a; text-align: center; font-weight: 500; }

    .sender-label { font-size: 12px; font-weight: 700; color: var(--primary-dark); margin-bottom: 2px; }
    .msg-footer {
      display: flex; justify-content: flex-end; align-items: center; gap: 4px; font-size: 11px; color: var(--text-muted); margin-top: 3px;
    }
    .ticks { color: #53bdeb; font-weight: 700; font-size: 12px; }

    /* Emoji Quick Picker */
    .emoji-bar {
      display: none; gap: 8px; padding: 8px 14px; background: var(--bg-panel); border-top: 1px solid var(--border); flex-wrap: wrap;
    }
    .emoji-bar span { cursor: pointer; font-size: 20px; }

    /* Input Bar */
    .input-bar {
      min-height: 62px; background: var(--bg-panel); padding: 10px 14px; display: flex; align-items: center; gap: 10px;
    }
    .input-bar input {
      flex: 1; padding: 11px 16px; border-radius: 22px; border: none; background: #fff; font-size: 15px; outline: none;
    }
    .send-btn {
      width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--primary); color: #fff;
      font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    /* Profile Modal */
    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 20;
      align-items: center; justify-content: center; padding: 16px;
    }
    .modal-card { background: #fff; width: 100%; max-width: 380px; border-radius: 12px; padding: 22px; }
    .modal-card h3 { margin-bottom: 14px; }

    @media (max-width: 768px) {
      .top-strip { display: none; }
      #app-screen { padding: 0; }
      .app-shell { border-radius: 0; }
      .sidebar { width: 100%; }
      .chat-area { display: none; width: 100%; }
      .app-shell.mobile-chat-open .sidebar { display: none; }
      .app-shell.mobile-chat-open .chat-area { display: flex; }
      .back-btn { display: inline-block; }
    }
  </style>
</head>
<body>
  <div class="top-strip"></div>

  <!-- LOGIN / REGISTER -->
  <div id="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-logo">MC</div>
        <h1 id="auth-app-name">My Chat</h1>
      </div>
      <p class="auth-tagline" id="auth-tagline">Fast, Simple & Private Messaging</p>

      <div class="auth-tabs">
        <div class="auth-tab active" data-mode="login">Login</div>
        <div class="auth-tab" data-mode="register">Create Account</div>
      </div>

      <form id="auth-form">
        <div class="field">
          <label>Phone Number</label>
          <input id="auth-phone" type="tel" placeholder="e.g. 03001234567" required />
        </div>
        <div class="field" id="name-field" style="display: none;">
          <label>Your Name</label>
          <input id="auth-name" type="text" placeholder="Enter your display name" maxlength="25" />
        </div>
        <div class="field">
          <label>4-Digit PIN</label>
          <input id="auth-pin" type="password" inputmode="numeric" maxlength="4" placeholder="e.g. 1234" required />
        </div>
        <button class="btn-primary" type="submit" id="auth-submit-btn">Login to My Chat</button>
        <div class="auth-error" id="auth-error"></div>
      </form>
    </div>
  </div>

  <!-- MAIN WHATSAPP SCREEN -->
  <div id="app-screen">
    <div class="app-shell" id="app-shell">
      <!-- Left Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="my-info" id="open-profile-btn" title="Edit Profile">
            <div class="avatar" id="my-avatar">?</div>
            <div>
              <div style="font-weight: 700; font-size: 14px;" id="my-name-label">User</div>
              <div style="font-size: 11px; color: var(--text-muted);" id="my-phone-label"></div>
            </div>
          </div>
          <div class="header-actions">
            <a class="icon-btn" href="/admin.html" target="_blank">Admin</a>
            <button class="icon-btn" id="logout-btn">Logout</button>
          </div>
        </div>

        <div class="search-box">
          <input id="search-input" type="text" placeholder="Search contacts..." />
        </div>

        <div class="chat-list" id="chat-list"></div>
      </aside>

      <!-- Right Chat Area -->
      <main class="chat-area">
        <div class="chat-header">
          <button class="back-btn" id="back-btn">←</button>
          <div class="avatar" id="active-avatar">G</div>
          <div class="chat-header-info">
            <h3 id="active-title">My Chat Community</h3>
            <p id="active-subtitle">Group Chat</p>
          </div>
        </div>

        <div class="announcement-bar" id="announcement-bar"></div>
        <div class="messages-container" id="messages-box"></div>

        <div class="emoji-bar" id="emoji-bar">
          <span>😀</span><span>😂</span><span>😍</span><span>🥳</span><span>👍</span>
          <span>❤️</span><span>🙏</span><span>🔥</span><span>🎉</span><span>😎</span>
        </div>

        <form class="input-bar" id="msg-form">
          <button type="button" class="icon-btn" id="emoji-toggle" style="font-size: 20px;">😊</button>
          <input id="msg-input" type="text" placeholder="Type a message" autocomplete="off" />
          <button class="send-btn" type="submit">➤</button>
        </form>
      </main>
    </div>
  </div>

  <!-- Profile Edit Modal -->
  <div class="modal-backdrop" id="profile-modal">
    <div class="modal-card">
      <h3>Edit Your Profile</h3>
      <div class="field">
        <label>Display Name</label>
        <input id="prof-name" type="text" maxlength="25" />
      </div>
      <div class="field">
        <label>About / Status</label>
        <input id="prof-about" type="text" maxlength="60" />
      </div>
      <div style="display: flex; gap: 10px;">
        <button class="btn-primary" id="save-profile-btn" type="button">Save</button>
        <button class="btn-primary" id="close-profile-btn" type="button" style="background:#64748b;">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let authMode = 'login';
    let socket = null;
    let me = null;
    let settings = { appName: 'My Chat', themeColor: '#00a884', announcement: '' };
    let allUsers = [];
    let allMessages = [];
    let activeChat = 'global'; // 'global' or target phone
    let unreadCounts = {};
    let typingMap = {};
    let typingTimer = null;

    const authScreen = document.getElementById('auth-screen');
    const appScreen = document.getElementById('app-screen');
    const appShell = document.getElementById('app-shell');
    const authForm = document.getElementById('auth-form');
    const authError = document.getElementById('auth-error');
    const nameField = document.getElementById('name-field');
    const authSubmitBtn = document.getElementById('auth-submit-btn');

    // Switch Login / Register tabs
    document.querySelectorAll('.auth-tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.auth-tab').forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        authMode = tab.dataset.mode;
        nameField.style.display = authMode === 'register' ? 'block' : 'none';
        authSubmitBtn.textContent = authMode === 'register' ? 'Create Account' : 'Login to My Chat';
        authError.textContent = '';
      });
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.textContent = '';
      const phone = document.getElementById('auth-phone').value;
      const name = document.getElementById('auth-name').value;
      const pin = document.getElementById('auth-pin').value;

      try {
        const res = await fetch(authMode === 'register' ? '/api/register' : '/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, name, pin })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Authentication failed');
        localStorage.setItem('mychat_token', data.token);
        startChatSession(data.token);
      } catch (err) {
        authError.textContent = err.message;
      }
    });

    function applySettings(s) {
      settings = s;
      document.title = s.appName || 'My Chat';
      document.getElementById('auth-app-name').textContent = s.appName || 'My Chat';
      document.getElementById('auth-tagline').textContent = s.tagline || '';
      if (s.themeColor) {
        document.documentElement.style.setProperty('--primary', s.themeColor);
      }
      const bar = document.getElementById('announcement-bar');
      if (s.announcement) {
        bar.style.display = 'flex';
        bar.textContent = '📢 ' + s.announcement;
      } else {
        bar.style.display = 'none';
      }
      renderChatHeader();
      renderChatList();
    }

    function startChatSession(token) {
      if (socket) socket.disconnect();
      socket = io({ auth: { token } });

      socket.on('init_data', (payload) => {
        me = payload.me;
        allUsers = payload.users;
        allMessages = payload.messages;
        applySettings(payload.settings);

        document.getElementById('my-avatar').textContent = me.name[0].toUpperCase();
        document.getElementById('my-avatar').style.background = me.avatarColor || '#00a884';
        document.getElementById('my-name-label').textContent = me.name;
        document.getElementById('my-phone-label').textContent = me.phone;

        authScreen.style.display = 'none';
        appScreen.style.display = 'block';
        renderChatList();
        renderChatHeader();
        renderMessages();
      });

      socket.on('users_updated', (users) => {
        allUsers = users;
        const updatedMe = users.find((u) => me && u.phone === me.phone);
        if (updatedMe) {
          me.name = updatedMe.name;
          me.about = updatedMe.about;
          document.getElementById('my-name-label').textContent = me.name;
        }
        renderChatList();
        renderChatHeader();
      });

      socket.on('settings_updated', (newSettings) => applySettings(newSettings));

      socket.on('new_message', (msg) => {
        allMessages.push(msg);
        const chatKey = msg.roomId === 'global'
          ? 'global'
          : (msg.fromPhone === me.phone ? msg.toPhone : msg.fromPhone);

        if (chatKey !== activeChat && msg.fromPhone !== me.phone) {
          unreadCounts[chatKey] = (unreadCounts[chatKey] || 0) + 1;
        }
        renderChatList();
        if (chatKey === activeChat) renderMessages();
      });

      socket.on('typing', ({ fromPhone, toPhone, isTyping }) => {
        const key = toPhone === 'global' ? 'global' : fromPhone;
        typingMap[key] = isTyping ? fromPhone : null;
        renderChatHeader();
      });

      socket.on('message_deleted', (msgId) => {
        allMessages = allMessages.filter((m) => m.id !== msgId);
        renderMessages();
        renderChatList();
      });

      socket.on('chat_cleared', (roomId) => {
        allMessages = allMessages.filter((m) => m.roomId !== roomId);
        renderMessages();
        renderChatList();
      });

      socket.on('force_logout', (reason) => {
        localStorage.removeItem('mychat_token');
        if (socket) socket.disconnect();
        appScreen.style.display = 'none';
        authScreen.style.display = 'flex';
        authError.textContent = reason || 'Logged out.';
      });
    }

    function getChatRoomId(target) {
      return target === 'global' ? 'global' : [me.phone, target].sort().join('_');
    }

    function renderChatList() {
      if (!me) return;
      const list = document.getElementById('chat-list');
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      list.innerHTML = '';

      const items = [
        { id: 'global', name: `${settings.appName} Community`, sub: 'Group Chat', color: settings.themeColor, online: true }
      ];

      allUsers
        .filter((u) => u.phone !== me.phone)
        .forEach((u) => {
          items.push({ id: u.phone, name: u.name, sub: u.about, color: u.avatarColor, online: u.online, phone: u.phone });
        });

      items
        .filter((item) => item.name.toLowerCase().includes(query) || (item.phone || '').includes(query))
        .forEach((item) => {
          const roomId = getChatRoomId(item.id);
          const roomMsgs = allMessages.filter((m) => m.roomId === roomId);
          const lastMsg = roomMsgs[roomMsgs.length - 1];
          const unread = unreadCounts[item.id] || 0;

          const row = document.createElement('div');
          row.className = `chat-item ${activeChat === item.id ? 'active' : ''}`;
          row.onclick = () => {
            activeChat = item.id;
            unreadCounts[item.id] = 0;
            appShell.classList.add('mobile-chat-open');
            renderChatList();
            renderChatHeader();
            renderMessages();
          };

          const av = document.createElement('div');
          av.className = 'avatar';
          av.style.background = item.color || '#00a884';
          av.textContent = item.id === 'global' ? '👥' : item.name[0].toUpperCase();
          if (item.id !== 'global' && item.online) {
            const dot = document.createElement('span');
            dot.className = 'online-dot';
            av.appendChild(dot);
          }

          const meta = document.createElement('div');
          meta.className = 'chat-meta';

          const top = document.createElement('div');
          top.className = 'chat-top';
          const nm = document.createElement('span');
          nm.className = 'chat-name';
          nm.textContent = item.name;
          const tm = document.createElement('span');
          tm.className = 'chat-time';
          tm.textContent = lastMsg ? lastMsg.time : '';
          top.append(nm, tm);

          const bottom = document.createElement('div');
          bottom.className = 'chat-bottom';
          const prev = document.createElement('span');
          prev.className = 'chat-preview';
          prev.textContent = lastMsg ? `${lastMsg.fromPhone === me.phone ? 'You: ' : ''}${lastMsg.text}` : item.sub;
          bottom.appendChild(prev);

          if (unread > 0) {
            const badge = document.createElement('span');
            badge.className = 'unread-badge';
            badge.textContent = unread;
            bottom.appendChild(badge);
          }

          meta.append(top, bottom);
          row.append(av, meta);
          list.appendChild(row);
        });
    }

    function renderChatHeader() {
      const av = document.getElementById('active-avatar');
      const title = document.getElementById('active-title');
      const sub = document.getElementById('active-subtitle');

      if (activeChat === 'global') {
        av.textContent = '👥';
        av.style.background = settings.themeColor || '#00a884';
        title.textContent = `${settings.appName} Community`;
        const onlineCount = allUsers.filter((u) => u.online).length;
        sub.textContent = typingMap['global'] ? 'Someone is typing...' : `${onlineCount} online • Tap contacts to chat privately`;
      } else {
        const contact = allUsers.find((u) => u.phone === activeChat);
        if (contact) {
          av.textContent = contact.name[0].toUpperCase();
          av.style.background = contact.avatarColor || '#00a884';
          title.textContent = contact.name;
          sub.textContent = typingMap[activeChat] ? 'typing...' : (contact.online ? 'online' : `offline • ${contact.about}`);
        }
      }
    }

    function renderMessages() {
      if (!me) return;
      const box = document.getElementById('messages-box');
      box.innerHTML = '';
      const roomId = getChatRoomId(activeChat);
      const msgs = allMessages.filter((m) => m.roomId === roomId);

      msgs.forEach((m) => {
        const row = document.createElement('div');
        const isMine = m.fromPhone === me.phone;
        row.className = `msg-row ${m.isAdmin ? 'admin' : (isMine ? 'out' : 'in')}`;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        if (!isMine && activeChat === 'global' && !m.isAdmin) {
          const sender = document.createElement('div');
          sender.className = 'sender-label';
          sender.textContent = m.fromName || m.fromPhone;
          bubble.appendChild(sender);
        }

        const textEl = document.createElement('div');
        textEl.textContent = m.text;
        bubble.appendChild(textEl);

        const footer = document.createElement('div');
        footer.className = 'msg-footer';
        const timeEl = document.createElement('span');
        timeEl.textContent = m.time;
        footer.appendChild(timeEl);

        if (isMine) {
          const ticks = document.createElement('span');
          ticks.className = 'ticks';
          ticks.textContent = '✓✓';
          footer.appendChild(ticks);
        }

        bubble.appendChild(footer);
        row.appendChild(bubble);
        box.appendChild(row);
      });
      box.scrollTop = box.scrollHeight;
    }

    // Send Message & Typing
    const msgInput = document.getElementById('msg-input');
    document.getElementById('msg-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      if (!text || !socket) return;
      socket.emit('send_message', { toPhone: activeChat, text });
      msgInput.value = '';
      clearTimeout(typingTimer);
      socket.emit('typing', { toPhone: activeChat, isTyping: false });
    });

    msgInput.addEventListener('input', () => {
      if (!socket) return;
      socket.emit('typing', { toPhone: activeChat, isTyping: true });
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => socket.emit('typing', { toPhone: activeChat, isTyping: false }), 1200);
    });

    document.getElementById('search-input').addEventListener('input', renderChatList);
    document.getElementById('back-btn').addEventListener('click', () => appShell.classList.remove('mobile-chat-open'));

    // Emoji picker
    const emojiBar = document.getElementById('emoji-bar');
    document.getElementById('emoji-toggle').addEventListener('click', () => {
      emojiBar.style.display = emojiBar.style.display === 'flex' ? 'none' : 'flex';
    });
    emojiBar.querySelectorAll('span').forEach((sp) => {
      sp.addEventListener('click', () => {
        msgInput.value += sp.textContent;
        msgInput.focus();
      });
    });

    // Profile Edit
    const profileModal = document.getElementById('profile-modal');
    document.getElementById('open-profile-btn').addEventListener('click', () => {
      document.getElementById('prof-name').value = me.name;
      document.getElementById('prof-about').value = me.about || '';
      profileModal.style.display = 'flex';
    });
    document.getElementById('close-profile-btn').addEventListener('click', () => profileModal.style.display = 'none');
    document.getElementById('save-profile-btn').addEventListener('click', () => {
      socket.emit('update_profile', {
        name: document.getElementById('prof-name').value,
        about: document.getElementById('prof-about').value
      });
      profileModal.style.display = 'none';
    });

    // Logout
    document.getElementById('logout-btn').addEventListener('click', async () => {
      const token = localStorage.getItem('mychat_token');
      await fetch('/api/logout', { method: 'POST', headers: { 'x-auth-token': token || '' } });
      localStorage.removeItem('mychat_token');
      if (socket) socket.disconnect();
      appScreen.style.display = 'none';
      authScreen.style.display = 'flex';
    });

    // Auto-login if saved token exists
    const savedToken = localStorage.getItem('mychat_token');
    if (savedToken) startChatSession(savedToken);
  </script>
</body>
</html>
